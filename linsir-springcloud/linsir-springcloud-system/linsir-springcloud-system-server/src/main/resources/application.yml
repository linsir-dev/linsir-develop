server:
  port: 8080

spring:
  application:
    name: linsir-springcloud-system-server

  # 禁用 DevTools 自动重启
  devtools:
    restart:
      enabled: false

  # 数据源配置 - Druid
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/linsir_springcloud_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    # Druid 连接池配置
    druid:
      # 初始化连接数
      initial-size: 5
      # 最小连接数
      min-idle: 5
      # 最大连接数
      max-active: 20
      # 获取连接等待超时时间（毫秒）
      max-wait: 60000
      # 检测间隔时间（毫秒）
      time-between-eviction-runs-millis: 60000
      # 连接在池中最小生存时间（毫秒）
      min-evictable-idle-time-millis: 300000
      # 连接在池中最大生存时间（毫秒）
      max-evictable-idle-time-millis: 900000
      # 检测连接是否有效的SQL
      validation-query: SELECT 1 FROM DUAL
      # 申请连接时检测
      test-while-idle: true
      # 申请连接时检测
      test-on-borrow: false
      # 归还连接时检测
      test-on-return: false
      # 是否缓存PreparedStatement
      pool-prepared-statements: true
      # 最大PreparedStatement缓存数
      max-pool-prepared-statement-per-connection-size: 20
      # 过滤器配置（监控、日志等）
      filters: stat,wall,slf4j
      # 合并SQL监控
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

# 日志配置
logging:
  level:
    root: INFO
    com.linsir.system: DEBUG
    com.alibaba.druid: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# MyBatis Plus 配置 - 基于注解的Mapper方式
mybatis-plus:
  configuration:
    # SQL日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 缓存开启
    cache-enabled: true
    # 延迟加载
    lazy-loading-enabled: true
    # 积极加载
    aggressive-lazy-loading: false
  global-config:
    db-config:
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键类型：自增
      id-type: auto
      # 表名前缀
      table-prefix: sys_
  # 实体类包路径
  type-aliases-package: com.linsir.system.modules.rbac.entity
  # 基于注解方式不需要配置 mapper-locations
  # mapper-locations: classpath*:/mapper/**/*.xml
