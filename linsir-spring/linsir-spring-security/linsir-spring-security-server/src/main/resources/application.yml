server:
  port: 8080

spring:
  application:
    name: linsir-spring-security-server
  devtools:
    restart:
      enabled: true  # 启用热部署
      additional-paths: src/main/java
    livereload:
      enabled: true  # 启用自动刷新
  thymeleaf:
    cache: false  # 禁用模板缓存，开发环境使用
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 0  # 禁用静态资源缓存，开发环境使用
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/linsir-spring-security-server?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.linsir.security.entity

logging:
  level:
    root: info
    com.linsir: debug
