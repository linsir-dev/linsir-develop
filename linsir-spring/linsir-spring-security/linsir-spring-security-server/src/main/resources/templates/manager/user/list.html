<!-- 用户列表页面 - 页面片段，无需完整HTML结构 -->

<!-- 分配角色对话框 -->
<div id="role-dialog" class="easyui-dialog" style="width:400px;height:350px;padding:20px;"
     data-options="
         closed:true,
         modal:true,
         buttons:[{
             text:'保存',
             iconCls:'icon-ok',
             handler:saveUserRoles
         },{
             text:'取消',
             iconCls:'icon-cancel',
             handler:function() {
                 $('#role-dialog').dialog('close');
             }
         }]
     ">
    <input type="hidden" id="role-user-id">
    <div style="margin-bottom:10px;">
        <span id="role-user-name" style="font-weight:bold;"></span>
    </div>
    <div id="role-checkboxes" style="height:250px;overflow-y:auto;">
        <!-- 角色复选框将动态加载 -->
    </div>
</div>

<!-- 查询工具栏 -->
<div id="user-search-toolbar" style="padding:5px;height:auto;">
    <div style="margin-bottom:5px;">
        <!-- 用户名输入框 -->
        <input id="search-username" class="easyui-textbox" data-options="prompt:'请输入用户名'" style="width:150px;">
        <!-- 状态下拉菜单 -->
        <select id="search-status" class="easyui-combobox" style="width:120px;" data-options="panelHeight:'auto',editable:false">
            <option value="">全部状态</option>
            <option value="1">启用</option>
            <option value="0">禁用</option>
        </select>
        <!-- 查询按钮 -->
        <a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-search" onclick="doSearch()">查询</a>
        <!-- 重置按钮 -->
        <a href="javascript:void(0)" class="easyui-linkbutton" iconCls="icon-clear" onclick="doReset()">重置</a>
    </div>
</div>

<!-- 数据表格 -->
<div style="height: calc(100% - 50px);">
    <table id="user-dg"></table>
</div>

<!-- 用户编辑对话框 -->
<div id="user-dialog" class="easyui-dialog" style="width:450px;height:380px;padding:20px;"
     data-options="
         closed:true,
         modal:true,
         buttons:[{
             text:'保存',
             iconCls:'icon-ok',
             handler:saveUser
         },{
             text:'取消',
             iconCls:'icon-cancel',
             handler:closeDialog
         }]
     ">
    <form id="user-form" method="post">
        <input type="hidden" id="user-id" name="id">
        <table style="width:100%;border-collapse:collapse;">
            <tr>
                <td style="padding:8px;width:80px;text-align:right;">用户名：</td>
                <td style="padding:8px;">
                    <input id="form-username" name="username" class="easyui-textbox"
                           data-options="required:true,validType:'length[3,20]'" style="width:280px;">
                </td>
            </tr>
            <tr>
                <td style="padding:8px;text-align:right;">密码：</td>
                <td style="padding:8px;">
                    <input id="form-password" name="password" class="easyui-passwordbox"
                           data-options="validType:'length[6,20]'" style="width:280px;">
                    <br><span id="pwd-tip" style="color:#999;font-size:12px;display:none;">（编辑时留空表示不修改）</span>
                </td>
            </tr>
            <tr>
                <td style="padding:8px;text-align:right;">昵称：</td>
                <td style="padding:8px;">
                    <input id="form-nickname" name="nickname" class="easyui-textbox" style="width:280px;">
                </td>
            </tr>
            <tr>
                <td style="padding:8px;text-align:right;">邮箱：</td>
                <td style="padding:8px;">
                    <input id="form-email" name="email" class="easyui-textbox"
                           data-options="validType:'email'" style="width:280px;">
                </td>
            </tr>
            <tr>
                <td style="padding:8px;text-align:right;">手机号：</td>
                <td style="padding:8px;">
                    <input id="form-phone" name="phone" class="easyui-textbox" style="width:280px;">
                </td>
            </tr>
            <tr>
                <td style="padding:8px;text-align:right;">状态：</td>
                <td style="padding:8px;">
                    <select id="form-status" name="status" class="easyui-combobox" style="width:280px;" data-options="panelHeight:'auto',editable:false">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </td>
            </tr>
        </table>
    </form>
</div>

<script>
    /**
     * 用户列表表格列定义
     * 定义DataGrid的所有列配置
     */
    var userColumns = [
        {
            // ID列
            field: 'id',
            title: 'ID',
            width: 60,
            align: 'center'
        },
        {
            // 用户名列
            field: 'username',
            title: '用户名',
            width: 100,
            align: 'center'
        },
        {
            // 昵称列
            field: 'nickname',
            title: '昵称',
            width: 100,
            align: 'center'
        },
        {
            // 邮箱列
            field: 'email',
            title: '邮箱',
            width: 150,
            align: 'center'
        },
        {
            // 手机号列
            field: 'phone',
            title: '手机号',
            width: 120,
            align: 'center'
        },
        {
            // 状态列
            field: 'status',
            title: '状态',
            width: 80,
            align: 'center',
            // 格式化状态显示：1-启用（绿色），0-禁用（红色）
            formatter: function(value, row, index) {
                if (value === 1) {
                    return '<span style="color:green;">启用</span>';
                } else {
                    return '<span style="color:red;">禁用</span>';
                }
            }
        },
        {
            // 创建时间列
            field: 'createTime',
            title: '创建时间',
            width: 150,
            align: 'center'
        },
        {
            // 更新时间列
            field: 'updateTime',
            title: '更新时间',
            width: 150,
            align: 'center'
        },
        {
            // 操作列
            field: 'operate',
            title: '操作',
            width: 80,
            align: 'center',
            formatter: function(value, row, index) {
                var editBtn = '<a href="javascript:void(0)" title="编辑" class="easyui-linkbutton" data-options="iconCls:\'icon-edit\',plain:true" style="margin:0 2px;" onclick="openEditDialogById(' + row.id + ')"></a>';
                var deleteBtn = '<a href="javascript:void(0)" title="删除" class="easyui-linkbutton" data-options="iconCls:\'icon-remove\',plain:true" style="margin:0 2px;" onclick="deleteUser(' + row.id + ', \'' + row.username + '\')"></a>';
                var roleBtn = '<a href="javascript:void(0)" title="分配角色" class="easyui-linkbutton" data-options="iconCls:\'icon-filter\',plain:true" style="margin:0 2px;" onclick="openRoleDialog(' + row.id + ', \'' + row.username + '\')"></a>';
                return editBtn + deleteBtn + roleBtn;
            }
        }
    ];

    /**
     * 工具栏配置
     * 定义DataGrid顶部工具栏按钮
     */
    var userToolbar = [
        {
            // 新增按钮
            text: '新增',
            iconCls: 'icon-add',
            handler: openAddDialog
        },
        '-', // 分隔符
        {
            // 刷新按钮
            text: '刷新',
            iconCls: 'icon-reload',
            handler: function() {
                // 重新加载表格数据
                $('#user-dg').datagrid('reload');
            }
        }
    ];

    /**
     * 执行查询
     * 根据搜索条件重新加载表格数据
     */
    function doSearch() {
        $('#user-dg').datagrid('load', {
            username: $('#search-username').textbox('getValue'),
            status: $('#search-status').combobox('getValue')
        });
    }

    /**
     * 重置查询条件
     * 清空搜索框并重新加载数据
     */
    function doReset() {
        $('#search-username').textbox('clear');
        $('#search-status').combobox('clear');
        $('#user-dg').datagrid('load', {});
    }

    /**
     * 打开新增用户对话框
     */
    function openAddDialog() {
        // 清空表单
        $('#user-form').form('clear');
        $('#user-id').val('');

        // 设置密码为必填
        $('#form-password').passwordbox({
            required: true,
            missingMessage: '请输入密码'
        });
        $('#pwd-tip').hide();

        // 设置默认状态为启用
        $('#form-status').combobox('setValue', '1');

        // 打开对话框
        $('#user-dialog').dialog({
            title: '新增用户',
            closed: false
        });
    }

    /**
     * 打开编辑用户对话框（通过行选择）
     */
    function openEditDialog() {
        // 获取选中的行
        var row = $('#user-dg').datagrid('getSelected');
        if (!row) {
            $.messager.alert('提示', '请选择要编辑的用户！', 'warning');
            return;
        }
        openEditDialogById(row.id);
    }

    /**
     * 打开编辑用户对话框（通过ID）
     * @param {number} id - 用户ID
     */
    function openEditDialogById(id) {
        // 根据ID获取行数据
        var rows = $('#user-dg').datagrid('getRows');
        var row = null;
        for (var i = 0; i < rows.length; i++) {
            if (rows[i].id === id) {
                row = rows[i];
                break;
            }
        }

        if (!row) {
            $.messager.show({
                title: '提示',
                msg: '未找到用户数据',
                timeout: 2000,
                showType: 'slide'
            });
            return;
        }

        // 清空表单
        $('#user-form').form('clear');

        // 设置密码为非必填（编辑时）
        $('#form-password').passwordbox({
            required: false
        });
        $('#pwd-tip').show();

        // 填充表单数据
        $('#user-id').val(row.id);
        $('#form-username').textbox('setValue', row.username);
        $('#form-nickname').textbox('setValue', row.nickname);
        $('#form-email').textbox('setValue', row.email);
        $('#form-phone').textbox('setValue', row.phone);
        $('#form-status').combobox('setValue', row.status);

        // 打开对话框
        $('#user-dialog').dialog({
            title: '编辑用户 - ' + row.username,
            closed: false
        });
    }

    /**
     * 删除用户
     * @param {number} id - 用户ID
     * @param {string} username - 用户名
     */
    function deleteUser(id, username) {
        $.messager.confirm('确认删除', '确定要删除用户 "' + username + '" 吗？', function(r) {
            if (r) {
                $.ajax({
                    url: '/api/user/delete/' + id,
                    type: 'DELETE',
                    success: function(res) {
                        if (res.code === 200) {
                            $.messager.show({
                                title: '提示',
                                msg: res.message,
                                timeout: 2000,
                                showType: 'slide'
                            });
                            $('#user-dg').datagrid('reload');
                        } else {
                            $.messager.show({
                                title: '错误',
                                msg: res.message,
                                timeout: 3000,
                                showType: 'slide'
                            });
                        }
                    },
                    error: function(xhr) {
                        var message = '删除失败！';
                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            message = xhr.responseJSON.message;
                        }
                        $.messager.show({
                            title: '错误',
                            msg: message,
                            timeout: 3000,
                            showType: 'slide'
                        });
                    }
                });
            }
        });
    }

    /**
     * 保存用户（新增或编辑）
     */
    function saveUser() {
        // 表单验证
        if (!$('#user-form').form('enableValidation').form('validate')) {
            return;
        }

        var id = $('#user-id').val();
        var isEdit = id && id !== '';

        // 收集表单数据
        var userData = {
            username: $('#form-username').textbox('getValue'),
            nickname: $('#form-nickname').textbox('getValue'),
            email: $('#form-email').textbox('getValue'),
            phone: $('#form-phone').textbox('getValue'),
            status: parseInt($('#form-status').combobox('getValue'))
        };

        // 处理密码
        var password = $('#form-password').passwordbox('getValue');
        if (password) {
            userData.password = password;
        }

        // 编辑时需要设置ID
        if (isEdit) {
            userData.id = parseInt(id);
        }

        // 发送请求
        var url = isEdit ? '/api/user/update/' + id : '/api/user/create';
        var method = isEdit ? 'PUT' : 'POST';

        $.ajax({
            url: url,
            type: method,
            contentType: 'application/json;charset=UTF-8',
            data: JSON.stringify(userData),
            success: function(res) {
                if (res.code === 200) {
                    $.messager.show({
                        title: '提示',
                        msg: res.message,
                        timeout: 2000,
                        showType: 'slide'
                    });
                    closeDialog();
                    $('#user-dg').datagrid('reload');
                } else {
                    $.messager.show({
                        title: '错误',
                        msg: res.message,
                        timeout: 3000,
                        showType: 'slide'
                    });
                }
            },
            error: function(xhr) {
                var message = '保存失败！';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                } else if (xhr.statusText) {
                    message = '保存失败！状态码：' + xhr.status + '，错误：' + xhr.statusText;
                }
                console.error('保存用户失败:', xhr);
                $.messager.show({
                    title: '错误',
                    msg: message,
                    timeout: 3000,
                    showType: 'slide'
                });
            }
        });
    }

    /**
     * 关闭对话框
     */
    function closeDialog() {
        $('#user-dialog').dialog('close');
    }

    /**
     * 打开分配角色对话框
     */
    function openRoleDialog(userId, username) {
        $('#role-user-id').val(userId);
        $('#role-user-name').text('为用户「' + username + '」分配角色');

        // 清空角色复选框
        $('#role-checkboxes').html('<div style="padding:20px;text-align:center;">加载中...</div>');

        // 打开对话框
        $('#role-dialog').dialog({
            title: '分配角色',
            closed: false
        });

        // 加载角色列表和用户当前角色
        loadRolesAndUserRoles(userId);
    }

    /**
     * 加载角色列表和用户当前角色
     */
    function loadRolesAndUserRoles(userId) {
        // 并行加载所有角色和用户的角色
        $.when(
            $.ajax({
                url: '/api/role/list',
                type: 'GET',
                data: { page: 1, rows: 100 }
            }),
            $.ajax({
                url: '/api/user/' + userId + '/roles',
                type: 'GET'
            })
        ).done(function(roleRes, userRoleRes) {
            var roles = roleRes[0].rows || [];
            var userRoles = userRoleRes[0].data || [];

            // 获取用户已有的角色ID
            var userRoleIds = userRoles.map(function(r) { return r.id; });

            // 生成角色复选框
            var html = '';
            if (roles.length === 0) {
                html = '<div style="padding:20px;text-align:center;">暂无可分配的角色</div>';
            } else {
                for (var i = 0; i < roles.length; i++) {
                    var role = roles[i];
                    var checked = userRoleIds.indexOf(role.id) >= 0 ? 'checked' : '';
                    html += '<div style="padding:5px;">';
                    html += '<input type="checkbox" name="role" value="' + role.id + '" ' + checked + ' style="vertical-align:middle;">';
                    html += '<span style="vertical-align:middle;margin-left:5px;">' + role.roleName + '</span>';
                    html += '</div>';
                }
            }

            $('#role-checkboxes').html(html);
        }).fail(function() {
            $('#role-checkboxes').html('<div style="padding:20px;text-align:center;color:red;">加载失败</div>');
        });
    }

    /**
     * 保存用户角色
     */
    function saveUserRoles() {
        var userId = $('#role-user-id').val();
        if (!userId) {
            $.messager.show({
                title: '错误',
                msg: '用户ID不能为空',
                timeout: 3000,
                showType: 'slide'
            });
            return;
        }

        // 获取选中的角色ID
        var roleIds = [];
        $('input[name="role"]:checked').each(function() {
            roleIds.push(parseInt($(this).val()));
        });

        $.ajax({
            url: '/api/user/' + userId + '/roles',
            type: 'POST',
            contentType: 'application/json;charset=UTF-8',
            data: JSON.stringify(roleIds),
            success: function(res) {
                if (res.code === 200) {
                    $.messager.show({
                        title: '提示',
                        msg: res.message,
                        timeout: 2000,
                        showType: 'slide'
                    });
                    $('#role-dialog').dialog('close');
                } else {
                    $.messager.show({
                        title: '错误',
                        msg: res.message,
                        timeout: 3000,
                        showType: 'slide'
                    });
                }
            },
            error: function(xhr) {
                var message = '保存失败！';
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    message = xhr.responseJSON.message;
                }
                $.messager.show({
                    title: '错误',
                    msg: message,
                    timeout: 3000,
                    showType: 'slide'
                });
            }
        });
    }

    /**
     * 页面初始化
     * 在DOM加载完成后初始化DataGrid
     */
    $(function() {
        // 初始化用户数据表格
        $('#user-dg').datagrid({
            // 主键字段，用于标识唯一行
            idField: 'id',
            // 数据加载时的提示消息
            loadMsg: '正在加载用户数据，请稍候...',
            // 无数据时显示的提示消息
            emptyMsg: '暂无用户数据',
            // 数据加载地址
            url: '/api/user/list',
            // 请求方式
            method: 'get',
            // 自适应父容器大小
            fit: true,
            // 自动调整列宽以适应表格宽度
            fitColumns: true,
            // 显示斑马纹效果
            striped: true,
            // 显示行号
            rownumbers: true,
            // 启用分页
            pagination: true,
            // 默认每页显示条数
            pageSize: 10,
            // 可选的每页显示条数
            pageList: [10, 20, 50, 100],
            // 列定义 - 使用双数组结构，外层用于分组，内层是实际列配置
            columns: [userColumns],
            // 工具栏配置
            toolbar: userToolbar,
            // 数据加载完成后解析操作列的按钮
            onLoadSuccess: function(data) {
                $('#user-dg').datagrid('getPanel').find('.easyui-linkbutton').linkbutton();
            }
        });
    });
</script>
