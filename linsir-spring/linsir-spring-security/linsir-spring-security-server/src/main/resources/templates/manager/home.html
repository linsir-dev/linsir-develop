<!-- 首页内容片段 - 无需完整的 HTML 结构 -->
<style>
    .dashboard-container {
        padding: 20px;
        height: 100%;
        overflow: auto;
        background: #f0f2f5;
    }

    .method-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .method-card h3 {
        margin-top: 0;
        color: #333;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    .method-card .loading {
        text-align: center;
        padding: 20px;
        color: #999;
    }

    .method-card .error {
        text-align: center;
        padding: 20px;
        color: #ff4d4f;
    }

    .user-info-table {
        width: 100%;
        border-collapse: collapse;
    }

    .user-info-table td {
        padding: 10px;
        border-bottom: 1px solid #f0f0f0;
    }

    .user-info-table td:first-child {
        width: 120px;
        color: #666;
        font-weight: bold;
    }

    .user-info-table tr:nth-child(even) {
        background: #f8f9fa;
    }

    .authority-tag {
        display: inline-block;
        background: #667eea;
        color: white;
        padding: 4px 12px;
        border-radius: 4px;
        margin: 2px;
        font-size: 12px;
    }

    .success-status {
        color: #52c41a;
        font-weight: bold;
    }

    .error-status {
        color: #ff4d4f;
        font-weight: bold;
    }
</style>

<div class="dashboard-container">
    <!-- 方法 1: 使用 SecurityContextHolder -->
    <div class="method-card">
        <h3>方法 1: 使用 SecurityContextHolder</h3>
        <div id="method1-content" class="loading">
            加载中...
        </div>
    </div>

    <!-- 方法 2: 使用 @AuthenticationPrincipal 注解 -->
    <div class="method-card">
        <h3>方法 2: 使用 @AuthenticationPrincipal 注解</h3>
        <div id="method2-content" class="loading">
            加载中...
        </div>
    </div>

    <!-- 方法 3: 使用 HttpServletRequest -->
    <div class="method-card">
        <h3>方法 3: 使用 HttpServletRequest</h3>
        <div id="method3-content" class="loading">
            加载中...
        </div>
    </div>

    <!-- 方法 4: 注入 Authentication 对象 -->
    <div class="method-card">
        <h3>方法 4: 注入 Authentication 对象</h3>
        <div id="method4-content" class="loading">
            加载中...
        </div>
    </div>
</div>

<script>
    // 显示当前用户信息 - 方法 1
    function loadUserInfoMethod1() {
        $.getJSON("/api/user/current/info1", function(data) {
            var content = $('#method1-content');
            if (data.code === 200) {
                var userData = data.data;
                var html = '<table class="user-info-table">';
                html += '<tr><td>用户名：</td><td>' + userData.username + '</td></tr>';
                html += '<tr><td>认证状态：</td><td><span class="success-status">✓ 已认证</span></td></tr>';
                html += '</table>';
                content.html(html);
            } else {
                content.html('<div class="error">' + data.message + '</div>');
            }
        }).fail(function() {
            $('#method1-content').html('<div class="error">获取失败</div>');
        });
    }

    // 显示当前用户信息 - 方法 2
    function loadUserInfoMethod2() {
        $.getJSON("/api/user/current/info2", function(data) {
            var content = $('#method2-content');
            if (data.code === 200) {
                var userData = data.data;
                var html = '<table class="user-info-table">';
                html += '<tr><td>用户名：</td><td>' + userData.username + '</td></tr>';
                html += '<tr><td>认证状态：</td><td><span class="success-status">✓ 已认证</span></td></tr>';
                if (userData.authorities && userData.authorities.length > 0) {
                    var authHtml = userData.authorities.map(function(auth) {
                        return '<span class="authority-tag">' + auth.authority + '</span>';
                    }).join('');
                    html += '<tr><td>权限：</td><td>' + authHtml + '</td></tr>';
                }
                html += '</table>';
                content.html(html);
            } else {
                content.html('<div class="error">' + data.message + '</div>');
            }
        }).fail(function() {
            $('#method2-content').html('<div class="error">获取失败</div>');
        });
    }

    // 显示当前用户信息 - 方法 4
    function loadUserInfoMethod4() {
        $.getJSON("/api/user/current/info4", function(data) {

            if (data.code === 200) {

                html += '<tr><td>认证状态：</td><td><span class="success-status">✓ 已认证</span></td></tr>';
                if (userData.authorities && userData.authorities.length > 0) {
                    var authHtml = userData.authorities.map(function(auth) {

                html += '</table>';

    // 页面加载时获取所有用户信息
    $(function() {
        loadUserInfoMethod1();
        loadUserInfoMethod2();
        loadUserInfoMethod3();
        loadUserInfoMethod4();
    });
</script>
